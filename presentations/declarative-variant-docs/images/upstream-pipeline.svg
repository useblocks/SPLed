<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" role="img" aria-label="Upstream pipeline: only a configured CMake build carries the variant; conf.py renders every document through Jinja with that context, while ubCode, ubc and a bare sphinx-build read the templates without any context.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#CECECE"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F87171"/>
    </marker>
    <style>
      .t  { font: 700 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .s  { font: 400 15px 'IBM Plex Mono', Consolas, Menlo, monospace; fill: #CECECE; }
      .n  { font: 400 15px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B8B8B8; }
      .lane { font: 600 14px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .08em; }
      .lbl { font: 500 14px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #CECECE; }
      .box { fill: #292929; stroke: #4A4A4A; stroke-width: 1.5; }
      .ln  { stroke: #CECECE; stroke-width: 1.8; fill: none; }
      .bad { stroke: #F87171; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- lanes -->
  <rect x="0" y="0" width="1160" height="170" rx="10" fill="#242424"/>
  <text class="lane" x="18" y="26" fill="#E4FF3D">INSIDE ONE CONFIGURED CMAKE BUILD</text>
  <rect x="0" y="330" width="1160" height="130" rx="10" fill="#2B2121"/>
  <text class="lane" x="18" y="356" fill="#F87171">EVERY OTHER READER</text>

  <!-- row A: the build path -->
  <rect class="box" x="18" y="48" width="180" height="96" rx="8"/>
  <text class="t" x="34" y="78">Feature model</text>
  <text class="s" x="34" y="104">KConfig</text>
  <text class="s" x="34" y="126">config.txt, parts</text>

  <rect class="box" x="246" y="48" width="190" height="96" rx="8"/>
  <text class="t" x="262" y="78">CMake configure</text>
  <text class="n" x="262" y="104">spl-core macros</text>
  <text class="n" x="262" y="126">per variant and kit</text>

  <rect class="box" x="484" y="48" width="210" height="96" rx="8"/>
  <text class="t" x="500" y="78">Build context</text>
  <text class="s" x="500" y="104">docs/config.json</text>
  <text class="s" x="500" y="126">kconfig/autoconf.json</text>

  <rect class="box" x="742" y="48" width="400" height="96" rx="8" style="stroke:#E4FF3D;stroke-width:2"/>
  <text class="t" x="758" y="78">sphinx-build, started by spl-core</text>
  <text class="n" x="758" y="104">env vars name the build context</text>
  <text class="n" x="758" y="126">conf.py renders every page through Jinja</text>

  <line class="ln" x1="198" y1="96" x2="244" y2="96" marker-end="url(#a)"/>
  <line class="ln" x1="436" y1="96" x2="482" y2="96" marker-end="url(#a)"/>
  <line class="ln" x1="694" y1="96" x2="740" y2="96" marker-end="url(#a)"/>

  <!-- documents: shared by both paths -->
  <rect class="box" x="484" y="202" width="658" height="96" rx="8"/>
  <text class="t" x="500" y="232">Documents: index.md, doc/**, components/*/doc/**</text>
  <text class="s" x="500" y="258">{% for c in build_config.components_info %}</text>
  <text class="s" x="500" y="280">{% if config.BLINKING %}  {{ timestamp }}</text>

  <line class="ln" x1="942" y1="202" x2="942" y2="146" marker-end="url(#a)"/>
  <text class="lbl" x="954" y="182">rendered with the build context</text>

  <!-- row C: static readers -->
  <rect class="box" x="18" y="372" width="430" height="72" rx="8"/>
  <text class="t" x="34" y="402">ubCode · ubc · editor · bare sphinx-build</text>
  <text class="n" x="34" y="428">read the documents as they are</text>

  <polyline class="ln" points="560,298 560,334 233,334 233,370" marker-end="url(#a)"/>

  <rect x="496" y="372" width="646" height="72" rx="8" fill="#292929" stroke="#F87171" stroke-width="2"/>
  <text class="t" x="512" y="402" style="fill:#F87171">No context: every template stays text</text>
  <text class="n" x="512" y="428">needs in inactive branches are indexed · the components page is empty</text>
  <line class="bad" x1="448" y1="408" x2="494" y2="408" marker-end="url(#r)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" role="img" aria-label="Declarative pipeline: tools/variant_data.py writes one variant cell per variant, kit and target without a compiler; Sphinx and ubc read the same three inputs, a cell, ubproject.toml and the 150 percent documents, and select the cell with the same override; a CI parity test checks both produce the same document set.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#CECECE"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ADE80"/>
    </marker>
    <style>
      .t  { font: 700 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .s  { font: 400 15px 'IBM Plex Mono', Consolas, Menlo, monospace; fill: #CECECE; }
      .n  { font: 400 15px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B8B8B8; }
      .lane { font: 700 14px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .08em; fill: #8A8A8A; }
      .lbl { font: 500 14px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #CECECE; }
      .box { fill: #292929; stroke: #4A4A4A; stroke-width: 1.5; }
      .ln  { stroke: #CECECE; stroke-width: 1.8; fill: none; }
      .ok  { stroke: #4ADE80; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- column captions -->
  <text class="lane" x="18" y="24">SELECT A VARIANT, ONCE</text>
  <text class="lane" x="278" y="24">THE SAME THREE INPUTS</text>
  <text class="lane" x="700" y="24">TWO READERS</text>

  <!-- generator column -->
  <rect class="box" x="18" y="40" width="214" height="112" rx="8" style="stroke:#E4FF3D"/>
  <text class="t" x="34" y="70">Feature model</text>
  <text class="n" x="34" y="96">KConfig model</text>
  <text class="n" x="34" y="118">config.txt per variant</text>
  <text class="n" x="34" y="140">parts.cmake per variant</text>

  <rect class="box" x="18" y="210" width="214" height="96" rx="8" style="stroke:#E4FF3D"/>
  <text class="t" x="34" y="240">variant_data.py</text>
  <text class="n" x="34" y="266">or CMake configure</text>
  <text class="n" x="34" y="288">cells, rules, selection</text>
  <line class="ln" x1="125" y1="152" x2="125" y2="208" marker-end="url(#a)"/>

  <!-- the shared inputs -->
  <rect class="box" x="278" y="40" width="366" height="112" rx="8" style="fill:#292929"/>
  <text class="t" x="294" y="70">Selection and cell</text>
  <text class="s" x="294" y="96">build/selection.toml → cell</text>
  <text class="n" x="294" y="118">features · variant · kit · target</text>
  <text class="n" x="294" y="140">components from parts.cmake</text>

  <rect class="box" x="278" y="170" width="366" height="112" rx="8" style="fill:#292929"/>
  <text class="t" x="294" y="200">ubproject.toml</text>
  <text class="n" x="294" y="226">needs model, complete</text>
  <text class="s" x="294" y="248">extend → generated rules</text>
  <text class="n" x="294" y="270">md include · rst from selection</text>

  <rect class="box" x="278" y="300" width="366" height="96" rx="8" style="fill:#292929"/>
  <text class="t" x="294" y="330">Documents, 150%</text>
  <text class="s" x="294" y="356">````{if} var.features.X</text>
  <text class="n" x="294" y="378">no Jinja anywhere</text>

  <polyline class="ln" points="232,258 255,258 255,96 276,96" marker-end="url(#a)"/>

  <!-- bus to the readers -->
  <line class="ln" x1="644" y1="96" x2="672" y2="96"/>
  <line class="ln" x1="644" y1="226" x2="672" y2="226"/>
  <line class="ln" x1="644" y1="348" x2="672" y2="348"/>
  <line class="ln" x1="672" y1="96" x2="672" y2="348"/>
  <line class="ln" x1="672" y1="120" x2="698" y2="120" marker-end="url(#a)"/>
  <line class="ln" x1="672" y1="300" x2="698" y2="300" marker-end="url(#a)"/>

  <!-- readers -->
  <rect class="box" x="700" y="64" width="318" height="112" rx="8" style="stroke:#4ADE80;stroke-width:2"/>
  <text class="t" x="716" y="94">sphinx-build</text>
  <text class="s" x="716" y="120">-D spl_selection=…</text>
  <text class="n" x="716" y="142">conf.py hands the selection on</text>
  <text class="n" x="716" y="164">spl-core: one file per run</text>

  <rect class="box" x="700" y="244" width="318" height="112" rx="8" style="stroke:#4ADE80;stroke-width:2"/>
  <text class="t" x="716" y="274">ubc · ubCode</text>
  <text class="s" x="716" y="300">-c &quot;$(cat selection)&quot;</text>
  <text class="n" x="716" y="322">IDE: through extend</text>
  <text class="s" x="716" y="344">build/selection.toml</text>

  <!-- outputs and parity -->
  <rect x="1044" y="94" width="106" height="52" rx="8" fill="#1E2B22" stroke="#4ADE80" stroke-width="1.5"/>
  <text class="t" x="1097" y="126" text-anchor="middle">HTML</text>
  <rect x="1044" y="274" width="106" height="52" rx="8" fill="#1E2B22" stroke="#4ADE80" stroke-width="1.5"/>
  <text class="t" x="1097" y="306" text-anchor="middle">IDE, CI</text>
  <line class="ok" x1="1018" y1="120" x2="1042" y2="120" marker-end="url(#g)"/>
  <line class="ok" x1="1018" y1="300" x2="1042" y2="300" marker-end="url(#g)"/>
  <line class="ok" x1="1097" y1="148" x2="1097" y2="272" stroke-dasharray="5 5"/>
  <text class="lbl" x="1097" y="206" text-anchor="middle" style="fill:#4ADE80">same</text>
  <text class="lbl" x="1097" y="224" text-anchor="middle" style="fill:#4ADE80">documents</text>

  <!-- footnote -->
  <text class="n" x="18" y="440">Both readers read the selected build's generated pages where spl-core writes them, through the same rst include.</text>
</svg>

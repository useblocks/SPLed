name: CI

on:
    push:
        branches: [develop, "release/*"]
    pull_request:
        branches: [develop, "release/*"]
    schedule:
        - cron: "0 0 * * *"

    workflow_dispatch:

jobs:
    determine-gate:
        name: Determine Quality Gate
        runs-on: ubuntu-24.04
        outputs:
            marker: ${{ steps.gate.outputs.marker }}
        steps:
            - name: Determine Quality Gate
              id: gate
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                      marker="gate_develop_nightly"
                  elif [ "${{ github.event_name }}" = "pull_request" ]; then
                      if [[ "${{ github.base_ref }}" == release/* ]]; then
                          marker="gate_release_pr"
                      else
                          marker="gate_develop_pr"
                      fi
                  elif [ "${{ github.event_name }}" = "push" ]; then
                      if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
                          marker="gate_release"
                      else
                          marker="gate_develop_push"
                      fi
                  else
                      marker="gate_develop_push"
                  fi
                  echo "Selected gate marker: $marker"
                  echo "marker=$marker" >> "$GITHUB_OUTPUT"

    documentation:
        name: Documentation (no compiler)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: determine-gate

        # The documentation is derivable from the sources alone: KConfig is pure
        # Python and the documents are text. Only CMake's top-level project()
        # call needs a C toolchain, and nothing here goes through it. So this
        # gate installs a Python and the locked dependencies, and nothing else --
        # no poks, no scoop, no cross-compiler. It is the fastest signal in the
        # workflow and it covers every variant, where the build jobs cover the
        # variants they build.
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install documentation dependencies
              run: |
                  pipx install poetry==2.4.1
                  poetry config virtualenvs.in-project true
                  poetry install --no-root

            # `ubc` is the second reader. Without it the parity tests skip, and
            # a guarantee that only holds on a developer machine is not a
            # guarantee -- so the gate installs it and CI_REQUIRE_UBC turns a
            # skip into a failure. No licence is needed for `check`; the inputs
            # are passed anyway so that adding the secrets later just works.
            - name: Install ubc
              uses: useblocks/ubc-action@0.1
              with:
                  version: "0.35.0"
                  license-key: ${{ secrets.UBCODE_LICENSE_KEY }}
                  license-user: ${{ secrets.UBCODE_LICENSE_USER }}

            - name: Documentation gate
              env:
                  CI_REQUIRE_UBC: "1"
              run: poetry run pytest -m "docs and ${{ needs.determine-gate.outputs.marker }}"

    test-on-windows:
        name: Build and Test on Windows
        runs-on: windows-2025
        timeout-minutes: 30
        needs: determine-gate

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Installation of Dependencies and Execute Tests
              env:
                  # Workaround to force usage of scoop apps installed in $env:USERPROFILE
                  USER_PATH_FIRST: 1
              run: |
                  .\build.ps1 -install
                  .\build.ps1 -selftests -marker "${{ needs.determine-gate.outputs.marker }}"
              shell: powershell

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (Windows)"

            - name: Deploy Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_windows
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error

    test-on-linux:
        name: Build and Test on Linux
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: determine-gate

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Provision via bootstrap scripts
              run: |
                  sudo ./bootstrap_ubuntu.sh
                  ./bootstrap_python.sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Installation of Dependencies and Execute Tests
              run: |
                  ./build.sh --install
                  ./build.sh --selftests --marker "${{ needs.determine-gate.outputs.marker }}"

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (Linux)"

            - name: Deploy Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_linux
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error

    test-devcontainer:
        name: Build and Test in DevContainer
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: determine-gate

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Installation of Dependencies and Execute Tests
              uses: devcontainers/ci@v0.3
              with:
                  push: never
                  runCmd: |
                      ./build.sh --selftests --marker "${{ needs.determine-gate.outputs.marker }}"

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (DevContainer)"

            - name: Deploy Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_devcon
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error

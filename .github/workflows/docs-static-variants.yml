name: Docs (Static Variants)

on:
    push:
        branches: [develop, "release/*"]
    pull_request:
        branches: [develop, "release/*"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Only one Pages deployment at a time; let in-flight runs finish instead of racing.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build-docs:
        name: Build Sphinx-Needs Docs (${{ matrix.variant }})
        runs-on: windows-latest

        strategy:
            fail-fast: false
            matrix:
                variant: [Disco, Sleep, Spa]

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Installation of Dependencies
              run: |
                  .\build.ps1 -install
              shell: powershell

            - name: Build Sphinx-Needs Docs for Variant '${{ matrix.variant }}'
              # The "docs" target is defined by spl-core's _spl_create_docs_target macro and is
              # only wired up when -buildKit test (see spl-core/src/spl_core/spl.cmake).
              run: |
                  .\build.ps1 -build -buildKit test -buildType Debug -target docs -variants ${{ matrix.variant }} -reconfigure
              shell: powershell

            - name: Deploy Docs Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sphinx-needs-docs-${{ matrix.variant }}
                  retention-days: 90
                  path: build/${{ matrix.variant }}/test/Debug/docs/html
                  if-no-files-found: error

    publish-docs:
        name: Assemble GitHub Pages Site
        needs: build-docs
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest

        steps:
            - name: Download Docs Artifacts of All Variants
              uses: actions/download-artifact@v4
              with:
                  pattern: sphinx-needs-docs-*
                  path: artifacts

            - name: Assemble Combined Site with Index Page
              shell: bash
              run: |
                  set -e
                  variants=(Disco Sleep Spa)

                  mkdir -p site
                  for variant in "${variants[@]}"; do
                      mkdir -p "site/$variant"
                      cp -r "artifacts/sphinx-needs-docs-$variant"/. "site/$variant/"
                  done

                  {
                      echo "<!doctype html>"
                      echo "<html lang=\"en\">"
                      echo "<head>"
                      echo "  <meta charset=\"utf-8\">"
                      echo "  <title>SPLed Sphinx-Needs Documentation</title>"
                      echo "</head>"
                      echo "<body>"
                      echo "  <h1>SPLed Sphinx-Needs Documentation</h1>"
                      echo "  <ul>"
                      for variant in "${variants[@]}"; do
                          echo "    <li><a href=\"$variant/index.html\">$variant</a></li>"
                      done
                      echo "  </ul>"
                      echo "</body>"
                      echo "</html>"
                  } > site/index.html

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy-docs:
        name: Deploy to GitHub Pages
        needs: publish-docs
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

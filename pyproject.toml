[project]
name = "spled"
version = "0.0.1"
description = "SPL demo project"
authors = [{ name = "Avengineers" }]
requires-python = ">=3.13,<3.14"

dependencies = [
    "spl-core @ git+https://github.com/useblocks/spl-core.git@develop",
    "pypeline-runner>=1,<2",
    "pytest>=8,<9",
    "myst-parser>=4.0,<5",
    "pypeline-semantic-release (>=0.4.1,<0.5.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 180

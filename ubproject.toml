"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# ---------------------------------------------------------------------------
# The one configuration file. Both readers of this project's documentation read
# it: ubCode and ubc directly, and the Sphinx build through `needs_from_toml`
# in conf.py.
#
# It used to `extend` spl-core's base configuration out of the virtualenv, by a
# path with the Python minor version baked into it. That was wrong twice over.
# The path named a Python that did not exist, so the base configuration silently
# failed to resolve for ubCode; and sphinx-needs does not implement `extend` at
# all -- it reads exactly one file's [needs] table -- so conf.py resolved the
# same base file a second time, through importlib. Two mechanisms for one file,
# one of them broken, and no way to tell from either end.
#
# spl-core's base needs configuration is therefore vendored below rather than
# referenced. test_ubproject_config.py fails if it drifts from what the
# installed spl-core ships, so vendoring cannot rot quietly.
# ---------------------------------------------------------------------------

[server]
index_on_save = true
hover_need_refs = true

[parse.parsers.rst]

[parse.parsers.md]
flavour = "myst"
include = ["*.md"]

[source]
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".svn", ".venv", ".vscode", "_build", "dist", "node_modules", "site-packages"]
respect_gitignore = false
# The generated source listings are documents; the rest of build/ is build
# output. Without the exclude, ubCode indexes every variant and every kit ever
# built, so need IDs appear many times over and the IDE disagrees with any one
# build about what the project contains. Sphinx never saw this because conf.py
# narrows its source set per build shape.
extend_include = ["generated/**/__source_docs/**"]
extend_exclude = ["build/**"]

[needs]
variant_data_file = "build/autoconf.json"

src_trace_config_from_toml = "ubproject.toml"

# Write the merged needs.json (all needs, after import and resolution).
build_json = true

# --- vendored from spl-core -------------------------------------------------
# Modernized to the `links`/`fields` tables while copying: the `extra_links`
# and `extra_options` lists spl-core still ships are deprecated in sphinx-needs
# and warned about on every build, and the `image` field below already used the
# new form, so the file was mixing both.

[needs.links.realizes]
incoming = "is realized by"
outgoing = "realizes"

[needs.links.fulfills]
incoming = "is fulfilled by"
outgoing = "fulfills"

[needs.links.refines]
incoming = "is refined by"
outgoing = "refines"

[needs.links.implements]
incoming = "is implemented by"
outgoing = "implements"

[needs.links.results]
incoming = "results from"
outgoing = "results"

[needs.links.verifies]
incoming = "is verified by"
outgoing = "verifies"

[needs.links.tests]
incoming = "is tested by"
outgoing = "tests"

[needs.fields.integrity]
# spl-core declares this through the deprecated `extra_options` list. That form
# implies an empty-string default, which is what every existing need carries, so
# it is stated explicitly here -- the modern form warns when a field declares
# neither schema, nullable nor default, and defaulting to null instead would
# change the value of `integrity` on all 87 needs.
description = "Integrity level of the need"
default = ""

[needs.fields.integrity.schema]
type = "string"

[[needs.types]]
directive = "arch"
title = "Architecture"
prefix = "A_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "R_"
color = "#BFD8D2"
style = "node"

[[needs.types]]
directive = "spec"
title = "Specification"
prefix = "S_"
color = "#FEDCD2"
style = "node"

[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "I_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "test"
title = "Test Case"
prefix = "T_"
color = "#DCB239"
style = "node"

# --- end vendored -----------------------------------------------------------

[needs.fields.image]
description = "Image associated with the need"
nullable = true

[needs.fields.image.schema]
type = "string"

[codelinks]
outdir = "output"
set_remote_url = true

[codelinks.projects.brightness_controller]
remote_url_pattern = "https://github.com/avengineers/SPLed/blob/{commit}/{path}#L{line}"

[codelinks.projects.brightness_controller.source_discover]
src_dir = "components/brightness_controller/src"
include = ["**/*.c", "**/*.h"]
comment_type = "cpp"

[codelinks.projects.brightness_controller.analyse]
get_oneline_needs = true
get_need_id_refs = false
get_rst = false

[codelinks.projects.brightness_controller.analyse.preprocessor]
compile_commands = "build/compile_commands.json"

[codelinks.projects.brightness_controller.analyse.oneline_comment_style]
start_sequence = "@need"
end_sequence = "\n"
field_split_char = ","

[[codelinks.projects.brightness_controller.analyse.oneline_comment_style.needs_fields]]
name = "title"

[[codelinks.projects.brightness_controller.analyse.oneline_comment_style.needs_fields]]
name = "id"

[[codelinks.projects.brightness_controller.analyse.oneline_comment_style.needs_fields]]
name = "type"
default = "impl"

[[codelinks.projects.brightness_controller.analyse.oneline_comment_style.needs_fields]]
name = "implements"
type = "list[str]"
default = []

[[codelinks.projects.brightness_controller.analyse.oneline_comment_style.needs_fields]]
name = "fulfills"
type = "list[str]"
default = []

# ---------------------------------------------------------------------------
# Variant-dependent documentation, read by sphinx-mounts.
#
# Each component's design documentation is mounted at its own real path, so the
# docname is exactly what it would be if the file were an ordinary source. What
# the mount adds is the `if` condition: the bundle is in the build only when the
# KConfig feature that owns it is enabled for the variant being built. The
# feature values come from the variant's autoconf.json, see conf.py.
#
# Every condition names only what the variant data file declares, so ubCode and any
# other reader of this file decide exactly what the Sphinx build decides. Keeping the
# per-component reports out of this is conf.py's job: it switches TOML reading off for
# those builds rather than encoding the build shape in a condition nothing else can see.
#
# This is the file-level half of variant handling. The block-level half is the
# {if} directive of Sphinx-Needs, used inside the component documents.
#
# `path_check = "off"` because these bundles are not self-contained by design:
# a component's design document legitimately reaches its own `src/` headers and
# the compilation database through sphinx-codelinks.
# ---------------------------------------------------------------------------

[[source.mounts]]
dir = "components/light_controller/doc"
mount_at = "components/light_controller/doc"
attach_to = "doc/components/index"
path_check = "off"

[[source.mounts]]
dir = "components/main_control_knob/doc"
mount_at = "components/main_control_knob/doc"
attach_to = "doc/components/index"
path_check = "off"

[[source.mounts]]
dir = "components/power_button/doc"
mount_at = "components/power_button/doc"
attach_to = "doc/components/index"
path_check = "off"

[[source.mounts]]
dir = "components/power_signal_processing/doc"
mount_at = "components/power_signal_processing/doc"
attach_to = "doc/components/index"
path_check = "off"

[[source.mounts]]
if = "var.features.BRIGHTNESS_ADJUSTMENT_ENABLED == True"
dir = "components/brightness_controller/doc"
mount_at = "components/brightness_controller/doc"
attach_to = "doc/components/index"
path_check = "off"

[[source.mounts]]
if = "var.features.AUTO_OFF == True"
dir = "components/auto_off/doc"
mount_at = "components/auto_off/doc"
attach_to = "doc/components/index"
path_check = "off"

# The integration test suite is not owned by a feature. It is added by Disco's
# parts.cmake for the test build kit only, so its document follows the variant
# rather than a KConfig symbol.
[[source.mounts]]
if = 'var.build_config.variant == "Disco"'
dir = "test/spled_integration/doc"
mount_at = "test/spled_integration/doc"
attach_to = "doc/components/index"
path_check = "off"
